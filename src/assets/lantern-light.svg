<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" role="img" aria-labelledby="lantern-light-title">
  <defs>
    <filter id="glow-light" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tassel -->
  <g stroke="#d69b32" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="148" x2="60" y2="172"/>
    <line x1="54" y1="148" x2="50" y2="168"/>
    <line x1="66" y1="148" x2="70" y2="168"/>
    <line x1="57" y1="148" x2="55" y2="170"/>
    <line x1="63" y1="148" x2="65" y2="170"/>
  </g>
  <!-- Bottom cap -->
  <rect x="42" y="138" width="36" height="10" rx="3" fill="#d69b32"/>
  <!-- Lantern body -->
  <rect x="28" y="46" width="64" height="96" rx="18" fill="#e74c3c"/>
  <!-- Body highlight -->
  <rect x="36" y="54" width="20" height="80" rx="10" fill="#ec7063" opacity=".45"/>
  <!-- Inner flame glow -->
  <circle cx="60" cy="94" r="14" fill="#f39c12" opacity=".35" filter="url(#glow-light)"/>
  <circle cx="60" cy="94" r="7" fill="#f1c40f" opacity=".6"/>
  <!-- Top cap -->
  <rect x="42" y="40" width="36" height="10" rx="3" fill="#d69b32"/>
  <!-- Handle -->
  <path d="M48 40 C48 28 52 24 60 24 C68 24 72 28 72 40" fill="none" stroke="#d69b32" stroke-width="3" stroke-linecap="round"/>
  <!-- Decorative bands -->
  <rect x="28" y="70" width="64" height="3" rx="1.5" fill="#c0392b" opacity=".5"/>
  <rect x="28" y="114" width="64" height="3" rx="1.5" fill="#c0392b" opacity=".5"/>
</svg>